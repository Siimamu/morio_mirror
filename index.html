<body>
    <style>
  body {
    background-color: #121212; /* 背景を黒に */
  }
td {
  padding: 10px;

}
        /* ヘッダー全体の境界線をリセット */
#table_int thead th {
    border-bottom: none !important;
}
</style>
    <header class="mb-3">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">IBARAGI_YOSHIMI ChartTable</span>
            </div>
        </nav>
    </header>

    <div class="container">

        <div class="alert alert-success mb-3" role="alert">
            <p>obj:IBARAGI_YOSHIMI(別名義含む)の自作差分置き場 普通の地力譜面多め</p>

        <!--ここから難易度表本体-->
        <div>
            <table class="table table-light table-hover table-sm" id="table_int">
            </table>
        </div>
        <script language="javascript" type="text/javascript">
            $(document).ready(function () {
                $.getJSON($("meta[name=bmstable]").attr("content"), function (header) {
                    $.getJSON(header.data_url, function (information) {
                        makeBMSTable(information, header.symbol);
                    });
                });
            });

            function makeBMSTable(info, mark) {
                var x = "";
                var ev = "";
                var count = 0;
                var obj = $("#table_int");

                obj.html("");
                $("<thead class='table-dark'><tr><th>Level</th><th>Title</th><th>Artist</th><th>Song</th><th>Chart</th><th>Video</th><th>Comment</th></tr></thead><tbody>")
                    .appendTo(obj);
                var obj_sep = null;
                for (var i = 0; i < info.length; i++) {
                    if (x != info[i].level) {
                        if (obj_sep != null) {
                        }
                        obj_sep = $("<tr class='table-dark' style='text-align:left' id='" + mark + info[i].level +
                            "'></tr>");
                        obj_sep.appendTo(obj);
                        count = 0;
                        x = info[i].level;
                    }
                    var str = $("<tr></tr>");

                    // Level
                    $("<td width='3%'>" + mark + x + "</td>").appendTo(str);

                    // Title
                    $("<td width='25%'>" +
                        "<a href='https://bms-ir.org/new/song?songmd5=" + info[
                            i]
                        .md5 + "' target='_blank'>" + info[i].title + "</a></td>").appendTo(str);

                    // Artist
                    $("<td width='15%'>" + info[i].artist + "</td>").appendTo(str);

// Title / Main Link
if (info[i].url != "" && info[i].url != null) {
    if (info[i].name != "" && info[i].name != null) {
        // パターン①：本体URLがあり、曲名（タイトル）もある場合（曲名にリンクを貼る）
        $("<td width='3%'><a href='" + info[i].url + "'>" + info[i].name + "</a></td>").appendTo(str);
    } else {
        // パターン②：本体URLはあるが、曲名が空の場合（URLをそのまま表示）
        $("<td width='3%'><a href='" + info[i].url + "'>" + info[i].url + "</a></td>").appendTo(str);
    }
} else {
    if (info[i].name != "" && info[i].name != null) {
        // パターン③：本体URLはないが、曲名はある場合（テキストのみ表示）
        $("<td width='3%'>" + info[i].name + "</td>").appendTo(str);
    } else {
        // パターン④：両方ない場合（空のセル）
        $("<td width='3%'></td>").appendTo(str);
    }
}

                     // Chart
                    if (info[i].url_diff != "" && info[i].url_diff != null) {
                        if (info[i].name_diff != "" && info[i].name_diff != null) {
                            $("<td width='3%'><a href='" + info[i].url_diff + "'>" + info[i].name_diff + "</a></td>").appendTo(str);
                        } else {
                            $("<td width='3%'><a href='" + info[i].url_diff + "'>" + info[i].url_diff + "</a></td>").appendTo(str);
                        }
                    } else {
                        if (info[i].name_diff != "" && info[i].name_diff != null) {
                            $("<td width='3%'>" + info[i].name_diff + "</td>").appendTo(str);
                        } else {
                            $("<td width='3%'></td>").appendTo(str);
                        }
                    }

                    // Video
   　　　　　　　　　if (info[i].url_yt != "" && info[i].url_yt != null) {
                        if (info[i].name_yt != "" && info[i].name_yt != null) {
                            $("<td width='3%'><a href='" + info[i].url_yt + "' target='_blank' rel='noopener noreferrer'>" + info[i].name_yt + "</a></td>").appendTo(str);
                        } else {
                            $("<td width='3%'><a href='" + info[i].url_yt + "' target='_blank' rel='noopener noreferrer'>" + info[i].url_yt + "</a></td>").appendTo(str);
                        }
                    } else {
                        if (info[i].name_yt != "" && info[i].name_yt != null) {
                            $("<td width='3%'>" + info[i].name_yt + "</td>").appendTo(str);
                        } else {
                            $("<td width='3%'></td>").appendTo(str);
                        }
                    }
                    
                    // Comment
                    $("<td width='15%'>" + info[i].comment + "</td>").appendTo(str);
                    str.appendTo(obj);
                    count++;

                }
            }
        </script>
    </div>
<script>
  $(window).on('load', function() {
    // 0.5秒ごとに、テーブルの中にデータが入ったかチェックする
    var checkExist = setInterval(function() {
      // 難易度表（#table_int）の中にある「行（tr）」の数を数える
      var rowCount = $('#table_int tr').length;

      // 行数が1より多い（＝ヘッダー以外のデータが入った）場合
      if (rowCount > 1) { 
     　 var musicCount = $('#table_int tr').has('td').length;
        
        // id="music-count" の場所に数字を書き込む
        $('#music-count').text(musicCount);
        
        // カウントが終わったので、チェック（監視）を止める
        clearInterval(checkExist);
      }
    }, 500); 
  });
</script>
